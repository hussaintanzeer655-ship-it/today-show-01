<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Today Show Hub</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><style>:root{--bg:#f6f7fb;--fg:#1f2937;--accent:#2563eb;--card:#ffffff;--shadow:0 6px 18px rgba(0,0,0,.08);}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial}.header{position:sticky;top:0;background:var(--card);border-bottom:1px solid #e5e7eb;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 20px;z-index:10} .logo{font-weight:700;letter-spacing:.5px} nav a{margin:0 8px;text-decoration:none;color:var(--fg);opacity:.8} nav a.active{opacity:1;text-decoration:underline} .container{max-width:1100px;margin:0 auto;padding:20px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px} .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--shadow);border:1px solid #eef2f7} .card h3{margin:0 0 8px;font-size:1.05rem} .card p{margin:0;color:#555} .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer} .footer{text-align:center; padding:20px 0; color:#666} @media (max-width:600px){.grid{grid-template-columns:1fr}} </style></head><body><header class="header"><div class="logo">Today Show</div><nav><a href="#live" class="active">Live</a><a href="#segments">Segments</a><a href="#about">About</a></nav><button class="btn" id="themeBtn">Toggle Theme</button></header><main class="container"><section id="live" class="grid" aria-label="live cards"></section><section id="segments" class="grid" aria-label="segments" style="margin-top:12px"></section><section id="about" class="card" style="margin-top:12px;">
  <h3>About</h3><p>Compact, responsive single-page concept for a news-style display.</p></section></main><div class="footer">© Today Show Hub</div><script>function makeCard(title, text){return `<div class=\"card\"><h3>${title}</h3><p>${text}</p></div>`} const live=data=[{t:"Breaking",d:"Live updates and quick headlines"},{t:"Weather",d:"Today’s forecast"},{t:"Sports",d:"Scores & highlights"}];const liveEl=document.getElementById('live');live.forEach((c)=>{liveEl.insertAdjacentHTML('beforeend', `<div class=\"card\"><h3>${c.t}</h3><p>${c.d}</p></div>`)})
const segEl=document.getElementById('segments');['Morning','Midday','Evening'].forEach((s)=>{segEl.insertAdjacentHTML('beforeend', makeCard(s, 'Top stories of the day.'))})
let dark=false;document.getElementById('themeBtn').addEventListener('click',()=>{dark=!dark; document.body.style.background = dark? '#0b1020':'#f6f7fb'; document.body.style.color = dark? '#eaeaff':'#1f2937';});</script></body></html>
